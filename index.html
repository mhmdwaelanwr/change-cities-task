<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Change Cities</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Change Cities</h2>

    <div class="buttons">
      <button id="cairoButton" onclick="changeCity('cairo')">Cairo</button>
      <button id="palestineButton" onclick="changeCity('palestine')">Palestine</button>
      <button id="emiratesButton" onclick="changeCity('emirates')">Emirates</button>
      <button onclick="removeCity()">Remove City</button>
    </div>

    <hr>

    <div id="cityBox">
      <h1 id="countryName">Egypt</h1>
      <p id="cityText">Cairo is the capital of Egypt and one of the largest cities in Africa.</p>
      <img id="cityImage" src="https://flagcdn.com/w640/eg.png" alt="flag">
    </div>

    <p id="emptyText"></p>

    <p class="footer">By Mohamed Anwar</p>
  </div>

  <script src="script.js"></script>
</body>
</html>

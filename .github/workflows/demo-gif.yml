name: Build Demo GIF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - 'scripts/record-demo.mjs'

permissions:
  contents: write

jobs:
  demo-gif:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright
        run: |
          npm install playwright --no-save
          npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Vite app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid

      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1

      - name: Record demo video
        run: node scripts/record-demo.mjs

      - name: Convert video to GIF
        run: |
          mkdir -p assets/demo
          ffmpeg -y \
            -i demo-video/change-cities-demo.webm \
            -vf "fps=12,scale=760:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=96[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3" \
            -loop 0 \
            assets/demo/change-cities-demo.gif

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo/change-cities-demo.gif
          if git diff --cached --quiet; then
            echo "Demo GIF did not change."
          else
            git commit -m "Update demo GIF"
            git push
          fi
